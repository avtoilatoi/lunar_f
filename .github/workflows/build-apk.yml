name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare build environment
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          echo "GEMINI_API_KEY=" > .env
          echo "GEMINI_API_KEY=" > .env.example

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew :app:assembleDebug -x test -x lint --no-configuration-cache --no-daemon --stacktrace 2>&1 | tee build.log || (echo "=== WHAT WENT WRONG ===" && grep -A 15 -B 2 "What went wrong:" build.log && echo "=== DETAILED CAUSES ===" && grep -A 8 -B 1 "Caused by:" build.log | head -n 30 && exit 1)

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LichAmNoi-v1.1-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
