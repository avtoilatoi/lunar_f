name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare build environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo 'GEMINI_API_KEY=""' > .env
          echo 'GEMINI_API_KEY=""' > .env.example
          echo 'GEMINI_API_KEY=""' >> gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          set +e
          ./gradlew :app:assembleDebug -x test -x lint --no-configuration-cache --no-daemon --stacktrace > build.log 2>&1
          GRADLE_EXIT_CODE=$?
          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "====================== BUILD FAILED: TASK & ERROR ======================"
            grep -E "(> Task :|FAILURE:|What went wrong:|Caused by:)" build.log | tail -n 25
            echo "------------------- DETAILS -------------------"
            grep -A 10 "What went wrong:" build.log || tail -n 40 build.log
            echo "========================================================================="
            exit $GRADLE_EXIT_CODE
          fi
          # Ensure uniform filename for auto-download
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LichAmNoi-v1.2.apk 2>/dev/null || true

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LichAmNoi-v1.2-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: "Lịch Âm Nổi v1.2"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/LichAmNoi-v1.2.apk
            app_version.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
